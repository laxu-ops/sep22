
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Admission Form</title>
    <link rel="stylesheet" href="style.css">
    
</head>

<body>

    <center>
        <h1>College Admission Form</h1>
        <p>Please fill the form below</p>
    </center>

    <hr>

    <!--
        This is a college form where students can
        enter their details and apply for admission.
    -->

    <form>

        <!-- Personal Information -->
        <fieldset>
            <legend><b>Personal Information</b></legend>

            <table cellpadding="8">

                <tr>
                    <td><label for="first-name">First Name:</label></td>
                    <td>
                        <input type="text" id="first-name"
                               size="45"
                               placeholder="First name"
                               autofocus required>
                    </td>
                </tr>

                <tr>
                    <td><label for="last-name">Last Name:</label></td>
                    <td>
                        <input type="text" id="last-name"
                               size="45"
                               placeholder="Last name"
                               required>
                    </td>
                </tr>

                <tr>
                    <td><label for="dob">Date of Birth:</label></td>
                    <td>
                        <input type="date" id="dob" required>
                    </td>
                </tr>

                <tr>
                    <td><label>Gender:</label></td>
                    <td>
                        <input type="radio" id="male"
                               name="gender" value="Male" required>
                        <label for="male">Male</label>

                        &nbsp;&nbsp;

                        <input type="radio" id="female"
                               name="gender" value="Female">
                        <label for="female">Female</label>

                        &nbsp;&nbsp;

                        <input type="radio" id="others"
                               name="gender" value="Others">
                        <label for="others">Others</label>
                    </td>
                </tr>

                <tr>
                    <td><label for="nationality">Nationality:</label></td>
                    <td>
                        <input type="text"
                               id="nationality"
                               name="nationality"
                               list="countries"
                               size="45"
                               placeholder="Start typing a country"
                               required>

                        <datalist id="countries">
                            <option value="Afghanistan">
                            <option value="Bangladesh">
                            <option value="Bhutan">
                            <option value="India">
                            <option value="Maldives">
                            <option value="Nepal">
                            <option value="Pakistan">
                            <option value="Sri Lanka">
                        </datalist>
                    </td>
                </tr>

                <tr>
                    <td><label for="citizenship">Citizenship Number:</label></td>
                    <td>
                        <input type="text"
                               id="citizenship"
                               size="45"
                               required>
                    </td>
                </tr>

            </table>
        </fieldset>

        <br>

        <!-- Contact and Address -->
        <fieldset>
            <legend><b>Contact & Address</b></legend>

            <table cellpadding="8">

                <tr>
                    <td><label for="phone">Phone:</label></td>
                    <td>
                        <input type="tel"
                               id="phone"
                               size="45"
                               required>
                    </td>
                </tr>

                <tr>
                    <td><label for="email">Email:</label></td>
                    <td>
                        <input type="email"
                               id="email"
                               size="45"
                               placeholder="example@email.com"
                               required>
                    </td>
                </tr>

                <tr>
                    <td><label for="country">Country:</label></td>
                    <td>
                        <input type="text"
                               id="country"
                               size="45"
                               placeholder="Nepal"
                               required>
                    </td>
                </tr>

                <tr>
                    <td><label for="district">District:</label></td>
                    <td>
                        <input type="text"
                               id="district"
                               size="45"
                               placeholder="Kaski"
                               required>
                    </td>
                </tr>

                <tr>
                    <td><label for="city">City:</label></td>
                    <td>
                        <input type="text"
                               id="city"
                               size="45"
                               placeholder="Pokhara, Kathmandu, Butwal"
                               required>
                    </td>
                </tr>

                <tr>
                    <td><label for="address">Full Address:</label></td>
                    <td>
                        <input type="text"
                               id="address"
                               size="45"
                               required>
                    </td>
                </tr>

            </table>
        </fieldset>

        <br>

        <!-- Academic Information -->
        <fieldset>
            <legend><b>Academic Information</b></legend>

            <table cellpadding="8">

                <tr>
                    <td><label for="school">Previous School/College:</label></td>
                    <td>
                        <input type="text"
                               id="school"
                               size="45"
                               required>
                    </td>
                </tr>

                <tr>
                    <td><label for="qualification">Previous Qualification:</label></td>
                    <td>
                        <select name="qualification"
                                id="qualification"
                                required>

                            <option value="">Select Qualification</option>
                            <option value="see">SEE</option>
                            <option value="plus2">+2</option>
                            <option value="diploma">Diploma</option>
                            <option value="bachelor">Bachelor</option>

                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label for="gpa">GPA / Percentage:</label></td>
                    <td>
                        <input type="text"
                               id="gpa"
                               size="45"
                               placeholder="3.5 or 75%"
                               required>
                    </td>
                </tr>

                <tr>
                    <td><label for="passed-year">Passed Year:</label></td>
                    <td>
                        <input type="number"
                               id="passed-year"
                               size="45"
                               required>
                    </td>
                </tr>

                <tr>
                    <td><label for="board">Board / University:</label></td>
                    <td>
                        <input type="text"
                               id="board"
                               size="45"
                               required>
                    </td>
                </tr>

            </table>
        </fieldset>

        <br>

        <!-- Course Information -->
        <fieldset>
            <legend><b>Course Information</b></legend>

            <table cellpadding="8">

                <tr>
                    <td><label for="course">Course / Program:</label></td>
                    <td>
                        <select name="course"
                                id="course"
                                required>

                            <option value="">Select Course</option>
                            <option value="bca">BCA</option>
                            <option value="bsc-csit">BSc CSIT</option>
                            <option value="bit">BIT</option>
                            <option value="bba">BBA</option>
                            <option value="bbs">BBS</option>

                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label for="faculty">Faculty:</label></td>
                    <td>
                        <input type="text"
                               id="faculty"
                               size="45"
                               required>
                    </td>
                </tr>

            </table>
        </fieldset>

        <br>

        <!-- Parent / Guardian Information -->
        <fieldset>
            <legend><b>Parent / Guardian Information</b></legend>

            <table cellpadding="8">

                <tr>
                    <td><label for="father-name">Father's Name:</label></td>
                    <td>
                        <input type="text"
                               id="father-name"
                               size="45"
                               required>
                    </td>
                </tr>

                <tr>
                    <td><label for="mother-name">Mother's Name:</label></td>
                    <td>
                        <input type="text"
                               id="mother-name"
                               size="45"
                               required>
                    </td>
                </tr>

                <tr>
                    <td><label for="guardian">Guardian's Name:</label></td>
                    <td>
                        <input type="text"
                               id="guardian"
                               size="45"
                               required>
                    </td>
                </tr>

                <tr>
                    <td><label for="guardian-phone">Guardian's Phone:</label></td>
                    <td>
                        <input type="tel"
                               id="guardian-phone"
                               size="45"
                               required>
                    </td>
                </tr>

                <tr>
                    <td><label for="occupation">Guardian's Occupation:</label></td>
                    <td>
                        <input type="text"
                               id="occupation"
                               size="45"
                               required>
                    </td>
                </tr>

            </table>
        </fieldset>

        <br>

        <!-- Emergency Contact -->
        <fieldset>
            <legend><b>Emergency Contact</b></legend>

            <table cellpadding="8">

                <tr>
                    <td><label for="emergency-name">Emergency Contact Name:</label></td>
                    <td>
                        <input type="text"
                               id="emergency-name"
                               size="45"
                               required>
                    </td>
                </tr>

                <tr>
                    <td><label for="relationship">Relationship:</label></td>
                    <td>
                        <input type="text"
                               id="relationship"
                               size="45"
                               placeholder="Father, Mother, Brother..."
                               required>
                    </td>
                </tr>

                <tr>
                    <td><label for="emergency-phone">Phone:</label></td>
                    <td>
                        <input type="tel"
                               id="emergency-phone"
                               size="45"
                               required>
                    </td>
                </tr>

            </table>
        </fieldset>

        <br>

        <!-- Documents -->
        <fieldset>
            <legend><b>Documents</b></legend>

            <table cellpadding="8">

                <tr>
                    <td><label for="photo">Passport Size Photo:</label></td>
                    <td>
                        <input type="file"
                               accept=".pdf"
                               id="photo"
                               required>
                    </td>
                </tr>

                <tr>
                    <td><label for="certificate">Academic Certificate:</label></td>
                    <td>
                        <input type="file"
                               id="certificate"
                               required>
                    </td>
                </tr>

                <tr>
                    <td><label for="citizenship-file">Citizenship / ID:</label></td>
                    <td>
                        <input type="file"
                               id="citizenship-file"
                               required>
                    </td>
                </tr>

            </table>
        </fieldset>

        <br>

        <!-- Declaration -->
        <fieldset>
            <legend><b>Declaration</b></legend>

            <table cellpadding="8">

                <tr>
                    <td colspan="2">
                        <input type="checkbox"
                               id="terms"
                               required>

                        <label for="terms">
                            I agree to the terms and conditions.
                        </label>
                    </td>
                </tr>

                <tr>
                    <td><label for="signature">Applicant Signature:</label></td>
                    <td>
                        <input type="file"
                               id="signature"
                               required>
                    </td>
                </tr>

                <tr>
                    <td><label for="application-date">Date:</label></td>
                    <td>
                        <input type="date"
                               id="application-date"
                               required>
                    </td>
                </tr>

            </table>
        </fieldset>

        <br>

        <!-- Buttons -->
        <center>
            <input type="submit" value="Submit">
            &nbsp;&nbsp;&nbsp;
            <input type="reset" value="Reset">
        </center>

    </form>

</body>
</html>
