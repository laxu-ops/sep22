<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video with Subtitles</title>
</head>
<body>

    <video controls>
        <source src="video.mp4" >

        <track 
            src="m.vtt"
            kind="subtitles"
            srclang="en"
            label="English"
            default>
    </track>
    <track 
            src="m.vtt"
            kind="subtitles"
            srclang="np"
            label="nepali"
            default>
    </track>
    </video>

</body>
</html>
