<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Admission Form</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>College Admission Form</h1>

    <form>

        <!-- FIELDSET 1 -->
        <fieldset class="active">
            <legend>Personal Information</legend>

            <label>First Name:</label>
            <input type="text" required>
            <br><br>

            <label>Last Name:</label>
            <input type="text" required>
            <br><br>

            <label>Date of Birth:</label>
            <input type="date" required>
            <br><br>

            <button type="button" onclick="nextFieldset()">Next</button>
        </fieldset>


        <!-- FIELDSET 2 -->
        <fieldset>
            <legend>Contact Information</legend>

            <label>Phone:</label>
            <input type="tel" required>
            <br><br>

            <label>Email:</label>
            <input type="email" required>
            <br><br>

            <label>Address:</label>
            <input type="text" required>
            <br><br>

            <button type="button" onclick="previousFieldset()">Previous</button>
            <button type="button" onclick="nextFieldset()">Next</button>
        </fieldset>


        <!-- FIELDSET 3 -->
        <fieldset>
            <legend>Academic Information</legend>

            <label>Previous School:</label>
            <input type="text" required>
            <br><br>

            <label>GPA:</label>
            <input type="number" step="0.01" required>
            <br><br>

            <button type="button" onclick="previousFieldset()">Previous</button>
            <button type="button" onclick="nextFieldset()">Next</button>
        </fieldset>


        <!-- FIELDSET 4 -->
        <fieldset>
            <legend>Course Information</legend>

            <label>Course:</label>

            <select required>
                <option value="">Select Course</option>
                <option>BCA</option>
                <option>BSc CSIT</option>
                <option>BIT</option>
                <option>BBA</option>
                <option>BBS</option>
            </select>

            <br><br>

            <button type="button" onclick="previousFieldset()">Previous</button>
            <button type="submit">Submit</button>
        </fieldset>

    </form>


    <script>

        let currentFieldset = 0;

        const fieldsets = document.querySelectorAll("fieldset");

        function showFieldset(number) {

            fieldsets.forEach(function(fieldset) {
                fieldset.classList.remove("active");
            });

            fieldsets[number].classList.add("active");
        }

        function nextFieldset() {

            if (currentFieldset < fieldsets.length - 1) {
                currentFieldset++;
                showFieldset(currentFieldset);
            }

        }

        function previousFieldset() {

            if (currentFieldset > 0) {
                currentFieldset--;
                showFieldset(currentFieldset);
            }

        }

    </script>

</body>
</html>
