<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!--
    this page will have a form where visitor can input their first name, last name, gender, country, city,
    phone, age, landline number, email, password, emergency contact, do you agree to terms and condition,
    fav colour, fav food.
    -->

    <form>

        <fieldset>
            <legend>personal info</legend>
            <label for="First name">First Name:</label>
            <br>
            <input type="text" id="First name" placeholder="first name" autofocus>

            <br>

            <label for="Last name">Last Name:</label>
            <br>
            <input type="text" id="Last name" placeholder="last name">

            <br>

            <label for="gender">Gender:</label>
            <br>
            <select name="gender" id="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
               
            </select>
            <br>
            <label for="country">Country:</label>
            <br>
            <input type="text" id="country">
            <br>

            <label for="city">City:</label>
            <br>
            <input type="text" id="city" placeholder="pokhara, ktm, butwal">
            <br>

        </fieldset>

        <fieldset>
            <legend>contact & address</legend>
            
            <label for="phone">Phone:</label>
            <br>
            <input type="tel" id="phone">
            <br>

            <label for="landline">Landline:</label>
            <br>
            <input type="text" id="landline">
            <br>
            <label for="email">Email:</label>
            <br>
            <input type="email" id="email">
            <br>

            <label for="password">Password:</label>
            <br>
            <input type="password" id="password">
            <br>

            <label for="emergency-contact">Emergency Contact:</label>
            <br>
            <input type="tel" id="emergency-contact">
            <br>
        </fieldset>

        <fieldset>
            <legend>others</legend>
            

            <label for="terms">Do you agree to terms and condition:</label>
            <br>
            <input type="checkbox" id="terms">
            <br>

            <label for="fav-food">Fav Food:</label>
            <br>
            <input type="text" id="fav-food">
            <br>

            <label for="fav-colour">Fav Colour:</label>
            <br>
            <input type="color" id="fav-colour">
            <br>
        </fieldset>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
